# Masks secrets in the Privilege SIEM audit events before they reach Elasticsearch.
# The Data field holds the whole changed object as JSON text, so it can hold virtual keys,
# provider keys and passwords (see GATEWAY-LOGGING-WITH-ELASTICSEARCH.md, "Secrets in the events").
asyncFuncTimeout: 1000
functions:
  - id: mask
    filter: "true"
    disabled: false
    conf:
      rules:
        # "<name containing password/secret/token/apikey/accesskey/virtualkey/providerkey>": "<value>"
        - matchRegex: /("\w*(?:password|passwd|secret|token|apikey|api_key|accesskey|virtualkey|providerkey)\w*"\s*:\s*")[^"]+(")/gi
          replaceExpr: "`${g1}***${g2}`"
        - matchRegex: /sk-[A-Za-z0-9_-]{16,}/g
          replaceExpr: "'sk-***'"
        - matchRegex: /Bearer\s+[A-Za-z0-9._~+\/=-]{8,}/g
          replaceExpr: "'Bearer ***'"
        - matchRegex: /eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/g
          replaceExpr: "'***jwt***'"
      # All fields: Privilege now puts the changed object in DataText (older events used Data) and in nested Resources/User/Device
      # objects, and a field list missed arrays. Volume is tiny, so scanning everything is cheap.
      fields:
        - "*"
      depth: 5
      flags: []
  # Runtime events from Privilege's own SIEM feed (Index aiguard-log, policy-decision-log, proxy-audit-log, ...) keep their payload in the
  # Data OBJECT. Promote the fields people filter on to top-level gw_* fields (user, agent key, policy, decision, ...), so Kibana needs no
  # nested paths. Data itself is left as it is. Missing keys stay absent. Console audit-log events carry Data as text, so they skip this.
  - id: eval
    filter: "typeof Data === 'object' && Data !== null"
    disabled: false
    conf:
      add:
        - {name: gw_user, value: Data.User}
        - {name: gw_agent_key, value: Data.AgentKey}
        - {name: gw_app, value: Data.App}
        - {name: gw_policy_ids, value: Data.PolicyIDs}
        - {name: gw_decision, value: Data.Decision}
        - {name: gw_decision_reason, value: Data.Reason}
        - {name: gw_decision_event, value: Data.Event}
        - {name: gw_stage, value: Data.Stage}
        - {name: gw_target, value: Data.Target}
        - {name: gw_flow, value: Data.Flow}
        - {name: gw_method, value: Data.Method}
        - {name: gw_path, value: Data.Path}
        - {name: gw_host, value: Data.Host}
        - {name: gw_principal, value: Data.Principal}
        - {name: gw_principal_kind, value: Data.PrincipalKind}
        - {name: gw_request_id, value: Data.RequestID}
        - {name: gw_tenant, value: Data.Tenant}
        - {name: gw_control_id, value: Data.ControlID}
        - {name: gw_resource_name, value: Data.ResourceName}
        - {name: gw_key_type, value: Data.KeyType}
      # Defense in depth: Privilege already strips these upstream (none seen in 23 live proxy-audit-log events), but never store them if that changes.
      remove:
        - "Data.Headers.Authorization"
        - "Data.Headers['Proxy-Authorization']"
        - "Data.Headers.Cookie"
        - "Data.Headers['Set-Cookie']"
        - "Data.Headers['X-Api-Key']"
  # Cribl adds _time (epoch seconds); the events already carry @timestamp.
  # Privilege's sender names the target index itself ("audit-log"); the cribl_siem user may only write ping-siem-events*,
  # and the existing history is in ping-siem-events-v2, so always write there.
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: __index
          value: "'ping-siem-events-v2'"
      remove:
        - _time
