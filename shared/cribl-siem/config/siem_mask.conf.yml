# Masks secrets in the Privilege SIEM audit events before they reach Elasticsearch.
# The Data field holds the whole changed object as JSON text, so it can hold virtual keys,
# provider keys and passwords (see GATEWAY-LOGGING-WITH-ELASTICSEARCH.md, "Secrets in the events").
asyncFuncTimeout: 1000
functions:
  - id: mask
    filter: "true"
    disabled: false
    conf:
      rules:
        # "<name containing password/secret/token/apikey/accesskey/virtualkey/providerkey>": "<value>"
        - matchRegex: /("\w*(?:password|passwd|secret|token|apikey|api_key|accesskey|virtualkey|providerkey)\w*"\s*:\s*")[^"]+(")/gi
          replaceExpr: "`${g1}***${g2}`"
        - matchRegex: /sk-[A-Za-z0-9_-]{16,}/g
          replaceExpr: "'sk-***'"
        - matchRegex: /Bearer\s+[A-Za-z0-9._~+\/=-]{8,}/g
          replaceExpr: "'Bearer ***'"
        - matchRegex: /eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/g
          replaceExpr: "'***jwt***'"
      # All fields: Privilege now puts the changed object in DataText (older events used Data) and in nested Resources/User/Device
      # objects, and a field list missed arrays. Volume is tiny, so scanning everything is cheap.
      fields:
        - "*"
      depth: 5
      flags: []
  # Cribl adds _time (epoch seconds); the events already carry @timestamp.
  # Privilege's sender names the target index itself ("audit-log"); the cribl_siem user may only write ping-siem-events*,
  # and the existing history is in ping-siem-events-v2, so always write there.
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: __index
          value: "'ping-siem-events-v2'"
      remove:
        - _time
