# lab-proxy: ONE entry for demo users - https://local.ping-devops.com:8443/ (launcher) and
# https://<app>.local.ping-devops.com:8443/ per lab. Joins each lab's compose network and proxies
# to the container by service DNS name (no host-port dependence). Publishes on 127.0.0.1 only.
# Lab networks are NOT listed here: a static external list blocks the proxy from starting until
# every lab has run once. scripts/lab-proxy-watchdog.sh attaches the proxy to each running lab's
# network instead (bootstrap, setup.sh update, and its launchd agent every 5 min).
services:
  lab-proxy:
    image: nginx:alpine
    restart: unless-stopped   # comes back when OrbStack starts
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./502.html:/usr/share/nginx/html/__lab-down.html:ro
      - ../tls/local.ping-devops.com-wild.pem:/etc/nginx/certs/local.ping-devops.com-wild.pem:ro
      - ../tls/local.ping-devops.com-wild-key.pem:/etc/nginx/certs/local.ping-devops.com-wild-key.pem:ro

