# lab-proxy: ONE entry for demo users - https://local.ping-devops.com:8443/ (launcher) and
# https://<app>.local.ping-devops.com:8443/ per lab. Joins each lab's compose network and proxies
# to the container by service DNS name (no host-port dependence). Publishes on 127.0.0.1 only.
services:
  lab-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../tls/local.ping-devops.com-wild.pem:/etc/nginx/certs/local.ping-devops.com-wild.pem:ro
      - ../tls/local.ping-devops.com-wild-key.pem:/etc/nginx/certs/local.ping-devops.com-wild-key.pem:ro
    networks:
      - pingone
      - pingfederate
      - privilege
      - ciba
      - gateway
      - cimd
      - ntnp
      - aigs
      - tokwb
      - hostile
      - killsw
      - custagent
      - regdemo
      - gwclient
      - meridian
      - learnhub
      - agentcore
      - gatewaysuite
      - shelf
      - codingagents

networks:
  pingone:
    external: true
    name: pingone-lab_default
  pingfederate:
    external: true
    name: pingfederate-lab_default
  privilege:
    external: true
    name: privilege-demo-lab_demo
  ciba:
    external: true
    name: ciba-hitl-lab_default
  agentcore:
    external: true
    name: agentcore-pingone-demo-lab_default
  gatewaysuite:
    external: true
    name: gateway-suite-lab_default
  gateway:
    external: true
    name: gateway-claims-lab_default
  cimd:
    external: true
    name: cimd-lab_default
  ntnp:
    external: true
    name: no-tool-no-promise_default
  aigs:
    external: true
    name: ai-guard-sidecar_default
  tokwb:
    external: true
    name: token-workbench_default
  hostile:
    external: true
    name: hostile-mcp_default
  killsw:
    external: true
    name: agent-kill-switch_default
  custagent:
    external: true
    name: customer-agent-lab_default
  regdemo:
    external: true
    name: agent-registry-demo_default
  gwclient:
    external: true
    name: ai-gateway-client-lab_default
  meridian:
    external: true
    name: meridian-a2a-hop-lab_demo
  learnhub:
    external: true
    name: learning-hub_default
  shelf:
    external: true
    name: demo-shelf-lab_default
  codingagents:
    external: true
    name: coding-agents-lab_default
