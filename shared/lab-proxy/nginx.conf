# lab-proxy: ONE domain family for every standalone lab demo.
#   https://<app>.local.ping-devops.com:8443/  ->  127.0.0.1:<app port>
# TLS: shared wildcard cert (*.local.ping-devops.com). Add a lab = add one server block.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# labs stream SSE (agent runs) and hold long requests; default 60s proxy timeouts cut them
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/local.ping-devops.com-wild.pem;
    ssl_certificate_key /etc/nginx/certs/local.ping-devops.com-wild-key.pem;
    return 302 https://local.ping-devops.com:8443/shelf/;  # unknown subdomain -> launcher
}

server {
    listen 8443 ssl;
    server_name pingone-lab.local.ping-devops.com;
    ssl_certificate     /etc/nginx/certs/local.ping-devops.com-wild.pem;
    ssl_certificate_key /etc/nginx/certs/local.ping-devops.com-wild-key.pem;
    location / { proxy_set_header Host pingone-lab.local.ping-devops.com:5500; proxy_pass https://pingone-lab-pingone-lab-1:5500; proxy_ssl_verify off; }
}
