# lab-proxy: ONE domain, ONE /etc/hosts entry (already present).
#   https://local.ping-devops.com:8443/            -> demo shelf (launcher)
#   https://local.ping-devops.com:8443/<lab>/      -> that lab; the proxy remembers the lab in a
#   cookie, so the SPA's absolute /api and /assets requests keep landing on the right lab.
# Owner rules: no new /etc/hosts entries; no subdomains. Add a lab = one proxy_pass line + cookie value.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# which lab this browser is currently visiting (set by the entry links' Set-Cookie)
map $cookie_lab $lab_upstream {
    default                 demo-shelf-lab-shelf-1:4400;
    pingone-lab             pingone-lab-pingone-lab-1:5500;
    pingfederate-lab        pingfederate-lab-pingfederate-lab-1:5400;
    privilege-demo          privilege-demo-lab-privilege-demo-lab-1:4510;
    ciba-hitl-lab           ciba-hitl-lab-ciba-hitl-lab-1:7580;
    gateway-claims          gateway-claims-lab-gateway-claims-lab-1:5150;
    cimd-lab                cimd-lab-cimd-lab-1:5250;
}

# scheme per lab (pingone + pingfederate serve TLS inside)
map $cookie_lab $lab_scheme {
    default                 http;
    pingone-lab             https;
    pingfederate-lab        https;
}

# which Host header each lab's own host-check expects (name:port as its allow-list has them)
map $cookie_lab $lab_host {
    default                 localhost:4400;
    pingone-lab             pingone-lab.local.ping-devops.com:5500;
    pingfederate-lab        pingfederate-lab.local.ping-devops.com:5400;
    privilege-demo          privilege-demo.local.ping-devops.com:4510;
    ciba-hitl-lab           ciba-hitl-lab.local.ping-devops.com:7580;
    gateway-claims          gateway-claims.local.ping-devops.com:5150;
    cimd-lab                cimd-lab.local.ping-devops.com:5250;
}

server {
    listen 8443 ssl default_server;
    server_name local.ping-devops.com;
    ssl_certificate     /etc/nginx/certs/local.ping-devops.com-wild.pem;
    ssl_certificate_key /etc/nginx/certs/local.ping-devops.com-wild-key.pem;

    resolver 127.0.0.11 valid=30s;
proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # entry links: set the cookie, then serve the lab's root HTML
    location = /pingone-lab      { add_header Set-Cookie "lab=pingone-lab; Path=/; SameSite=Lax" always; proxy_pass https://pingone-lab-pingone-lab-1:5500/; proxy_set_header Host pingone-lab.local.ping-devops.com:5500; proxy_ssl_verify off; }
    location = /pingone-lab/     { add_header Set-Cookie "lab=pingone-lab; Path=/; SameSite=Lax" always; proxy_pass https://pingone-lab-pingone-lab-1:5500/; proxy_set_header Host pingone-lab.local.ping-devops.com:5500; proxy_ssl_verify off; }
    location = /pingfederate-lab { add_header Set-Cookie "lab=pingfederate-lab; Path=/; SameSite=Lax" always; proxy_pass https://pingfederate-lab-pingfederate-lab-1:5400/; proxy_set_header Host pingfederate-lab.local.ping-devops.com:5400; proxy_ssl_verify off; }
    location = /privilege-demo/  { add_header Set-Cookie "lab=privilege-demo; Path=/; SameSite=Lax" always; proxy_pass http://privilege-demo-lab-privilege-demo-lab-1:4510/; proxy_set_header Host privilege-demo.local.ping-devops.com:4510; }
    location = /ciba-hitl-lab/   { add_header Set-Cookie "lab=ciba-hitl-lab; Path=/; SameSite=Lax" always; proxy_pass http://ciba-hitl-lab-ciba-hitl-lab-1:7580/; proxy_set_header Host ciba-hitl-lab.local.ping-devops.com:7580; }
    location = /gateway-claims/  { add_header Set-Cookie "lab=gateway-claims; Path=/; SameSite=Lax" always; proxy_pass http://gateway-claims-lab-gateway-claims-lab-1:5150/; proxy_set_header Host gateway-claims.local.ping-devops.com:5150; }
    location = /cimd-lab/        { add_header Set-Cookie "lab=cimd-lab; Path=/; SameSite=Lax" always; proxy_pass http://cimd-lab-cimd-lab-1:5250/; proxy_set_header Host cimd-lab.local.ping-devops.com:5250; }

    # everything else (SPA absolute /api, /assets) goes to the remembered lab
    location / {
        proxy_set_header Host $lab_host;
        proxy_pass $lab_scheme://$lab_upstream;
        proxy_ssl_verify off;
    }
}
