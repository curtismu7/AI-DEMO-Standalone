    location = /id-jag-kit      { add_header Set-Cookie "lab=id-jag-kit; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:4720/; proxy_set_header Host id-jag-kit.local.ping-devops.com:4720; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto https; }
