server {
    listen 8443 ssl default_server;
    server_name local.ping-devops.com;
    ssl_certificate     /etc/nginx/certs/local.ping-devops.com-wild.pem;
    ssl_certificate_key /etc/nginx/certs/local.ping-devops.com-wild-key.pem;

    resolver 127.0.0.11 valid=30s;
proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;


    location = /demo-shelf   { add_header Set-Cookie "lab=; Path=/; Max-Age=0" always; set $up_demo_shelf "demo-shelf-lab-shelf-1:4400"; proxy_pass http://$up_demo_shelf/; proxy_set_header Host 127.0.0.1:4400; }
    location = /demo-shelf/  { add_header Set-Cookie "lab=; Path=/; Max-Age=0" always; set $up_demo_shelf "demo-shelf-lab-shelf-1:4400"; proxy_pass http://$up_demo_shelf/; proxy_set_header Host 127.0.0.1:4400; }

    # entry links: set the cookie, then serve the lab's root HTML
    location = /pingone-lab { add_header Set-Cookie "lab=pingone-lab; Path=/; SameSite=Lax" always; set $up_pingone_lab "pingone-lab-pingone-lab-1:5500"; proxy_pass http://$up_pingone_lab/; proxy_set_header Host pingone-lab.local.ping-devops.com:5500; }
