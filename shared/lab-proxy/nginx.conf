# lab-proxy: ONE domain, ONE /etc/hosts entry (already present).
#   https://local.ping-devops.com:8443/            -> demo shelf (launcher)
#   https://local.ping-devops.com:8443/<lab>/      -> that lab; the proxy remembers the lab in a
#   cookie, so the SPA's absolute /api and /assets requests keep landing on the right lab.
# Owner rules: no new /etc/hosts entries; no subdomains. Add a lab = one proxy_pass line + cookie value.
# NOTE: upstreams resolve at request time (resolver + $lab_upstream) — the launcher starts even when labs are down.
# Shelf cards with a matching PROXY_PATHS entry in demo-shelf-LAB server/src/app.js open through this domain;
# labs without a route fall back to their direct URL — add both entries when wiring a new lab.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# which lab this browser is currently visiting (set by the entry links' Set-Cookie)
map $cookie_lab $lab_upstream {
    default                 demo-shelf-lab-shelf-1:4400;
    pingone-lab             pingone-lab-pingone-lab-1:5500;
    pingfederate-lab        pingfederate-lab-pingfederate-lab-1:5400;
    privilege-demo          privilege-demo-lab-privilege-demo-lab-1:4510;
    ciba-hitl-lab           ciba-hitl-lab-ciba-hitl-lab-1:7580;
    agentcore-pingone       agentcore-pingone:7601;
    gateway-suite           gateway-suite-lab:5750;
    gateway-claims          gateway-claims-lab-gateway-claims-lab-1:5150;
    cimd-lab                cimd-lab-cimd-lab-1:5250;
    ai-guard-sidecar        ai-guard-sidecar-ai-guard-sidecar-1:6500;
    token-workbench        token-workbench-token-workbench-1:5910;
    hostile-mcp        hostile-mcp-hostile-mcp-1:4701;
    agent-kill-switch        agent-kill-switch-agent-kill-switch-1:6550;
    customer-agent        customer-agent-lab-customer-agent-lab-1:5601;
    agent-registry-demo        agent-registry-demo-agent-registry-demo-1:5010;
    ai-gateway-client        ai-gateway-client-lab-app-1:6880;
    meridian-a2a-hop        meridian-a2a-hop-lab-meridian-a2a-hop-lab-1:6600;
    learning-hub            learning-hub:4600;
    agent-connect           host.docker.internal:5100;
    no-tool-no-promise        no-tool-no-promise-no-tool-no-promise-1:3000;
    mcp-discovery          mcp-discovery-mcp-discovery-1:5310;
    mcp-scanner            mcp-scanner-lab-mcp-scanner-lab-1:7650;
    p1az-inspector         p1az-inspector-lab-p1az-inspector-lab-1:4840;
    jit-lab                jit-lab-jit-lab-1:7570;
    obo-lab                obo-lab-obo-lab-1:7560;
    jev-lab                jev-lab-jev-lab-1:7550;
    deploy-test            deploy-test-lab-app-1:5590;
    pingone-mcp-inspector  pingone-mcp-inspector-lab-pingone-mcp-inspector-lab-1:5201;
    privilege-map          privilege-map-lab-privilege-map-1:5301;
    privilege-a2a          privilege-a2a-anthropic-demo-lab-main-1:6881;
    mcp-demo-client        mcp-demo-client-privilege-lab-app-1:6884;
    coding-agents        coding-agents-lab-coding-agents-lab-1:7150;
    intent-purpose-behaviour  intent-purpose-behaviour-lab-intent-purpose-behaviour-lab-1:7100;
    saas-access          saas-access-lab-saas-access-lab-1:7250;
    data-protection      data-protection-lab-data-protection-lab-1:7200;
    id-jag-kit           host.docker.internal:4720;
    idjag-runner         host.docker.internal:4780;
}

# scheme per lab (pingone + pingfederate serve TLS inside)
map $cookie_lab $lab_scheme {
    default                 http;
    pingone-lab             https;
    pingfederate-lab        https;
}

# which Host header each lab's own host-check expects (name:port as its allow-list has them)
map $cookie_lab $lab_host {
    default                 localhost:4400;
    pingone-lab             pingone-lab.local.ping-devops.com:5500;
    pingfederate-lab        pingfederate-lab.local.ping-devops.com:5400;
    privilege-demo          privilege-demo.local.ping-devops.com:4510;
    ciba-hitl-lab           ciba-hitl-lab.local.ping-devops.com:7580;
    agentcore-pingone       agentcore-pingone.local.ping-devops.com:7601;
    gateway-suite           gateway-suite-lab.local.ping-devops.com:5750;
    gateway-claims          gateway-claims.local.ping-devops.com:5150;
    cimd-lab                cimd-lab.local.ping-devops.com:5250;
    ai-guard-sidecar        ai-guard-sidecar.local.ping-devops.com:6500;
    token-workbench        token-workbench.local.ping-devops.com:5910;
    hostile-mcp        hostile-mcp.local.ping-devops.com:4701;
    agent-kill-switch        agent-kill-switch.local.ping-devops.com:6550;
    customer-agent        customer-agent.local.ping-devops.com:5601;
    agent-registry-demo        agent-registry-demo.local.ping-devops.com:5010;
    ai-gateway-client        ai-gateway-client.local.ping-devops.com:6880;
    meridian-a2a-hop        meridian-a2a-hop.local.ping-devops.com:6600;    learning-hub            learning-hub.local.ping-devops.com:4600;
    agent-connect           local.ping-devops.com:5100;
    coding-agents        coding-agents-lab.local.ping-devops.com:7150;
    intent-purpose-behaviour  intent-purpose-behaviour-lab.local.ping-devops.com:7100;
    saas-access          saas-access-lab.local.ping-devops.com:7250;
    data-protection      data-protection-lab.local.ping-devops.com:7200;
    id-jag-kit           id-jag-kit.local.ping-devops.com:4720;
    idjag-runner         idjag-runner.local.ping-devops.com:4780;
}

server {
    listen 8443 ssl default_server;
    server_name local.ping-devops.com;
    ssl_certificate     /etc/nginx/certs/local.ping-devops.com-wild.pem;
    ssl_certificate_key /etc/nginx/certs/local.ping-devops.com-wild-key.pem;

    resolver 127.0.0.11 valid=30s;
proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;


    location = /demo-shelf   { add_header Set-Cookie "lab=; Path=/; Max-Age=0" always; proxy_pass http://demo-shelf-lab-shelf-1:4400/; proxy_set_header Host 127.0.0.1:4400; }
    location = /demo-shelf/  { add_header Set-Cookie "lab=; Path=/; Max-Age=0" always; proxy_pass http://demo-shelf-lab-shelf-1:4400/; proxy_set_header Host 127.0.0.1:4400; }

    # entry links: set the cookie, then serve the lab's root HTML
    location = /pingone-lab      { add_header Set-Cookie "lab=pingone-lab; Path=/; SameSite=Lax" always; proxy_pass https://$lab_upstream/; proxy_set_header Host pingone-lab.local.ping-devops.com:5500; proxy_ssl_verify off; }
    location = /pingone-lab/     { add_header Set-Cookie "lab=pingone-lab; Path=/; SameSite=Lax" always; proxy_pass https://$lab_upstream/; proxy_set_header Host pingone-lab.local.ping-devops.com:5500; proxy_ssl_verify off; }
    location = /pingfederate-lab { add_header Set-Cookie "lab=pingfederate-lab; Path=/; SameSite=Lax" always; proxy_pass https://$lab_upstream/; proxy_set_header Host pingfederate-lab.local.ping-devops.com:5400; proxy_ssl_verify off; }
    location = /privilege-demo/ { add_header Set-Cookie "lab=privilege-demo; Path=/; SameSite=Lax" always; set $up_privilege_demo "privilege-demo-lab-privilege-demo-lab-1:4510"; proxy_pass http://$up_privilege_demo/; proxy_set_header Host privilege-demo.local.ping-devops.com:4510; }
    location = /ciba-hitl-lab/ { add_header Set-Cookie "lab=ciba-hitl-lab; Path=/; SameSite=Lax" always; set $up_ciba_hitl_lab "ciba-hitl-lab-ciba-hitl-lab-1:7580"; proxy_pass http://$up_ciba_hitl_lab/; proxy_set_header Host ciba-hitl-lab.local.ping-devops.com:7580; }
    location = /agentcore-pingone/ { add_header Set-Cookie "lab=agentcore-pingone; Path=/; SameSite=Lax" always; set $up_agentcore_pingone "agentcore-pingone:7601"; proxy_pass http://$up_agentcore_pingone/; proxy_set_header Host agentcore-pingone.local.ping-devops.com:7601; }
    location = /gateway-suite/ { add_header Set-Cookie "lab=gateway-suite; Path=/; SameSite=Lax" always; set $up_gateway_suite "gateway-suite-lab:5750"; proxy_pass http://$up_gateway_suite/; proxy_set_header Host gateway-suite-lab.local.ping-devops.com:5750; }
    location = /gateway-claims/ { add_header Set-Cookie "lab=gateway-claims; Path=/; SameSite=Lax" always; set $up_gateway_claims "gateway-claims-lab-gateway-claims-lab-1:5150"; proxy_pass http://$up_gateway_claims/; proxy_set_header Host gateway-claims.local.ping-devops.com:5150; }
    location = /cimd-lab/ { add_header Set-Cookie "lab=cimd-lab; Path=/; SameSite=Lax" always; set $up_cimd_lab "cimd-lab-cimd-lab-1:5250"; proxy_pass http://$up_cimd_lab/; proxy_set_header Host cimd-lab.local.ping-devops.com:5250; }
    location = /no-tool-no-promise/ { add_header Set-Cookie "lab=no-tool-no-promise; Path=/; SameSite=Lax" always; set $up_no_tool_no_promise "no-tool-no-promise-no-tool-no-promise-1:3000"; proxy_pass http://$up_no_tool_no_promise/; proxy_set_header Host no-tool-no-promise.local.ping-devops.com:5350; }
    location = /ai-guard-sidecar/ { add_header Set-Cookie "lab=ai-guard-sidecar; Path=/; SameSite=Lax" always; set $up_ai_guard_sidecar "ai-guard-sidecar-ai-guard-sidecar-1:6500"; proxy_pass http://$up_ai_guard_sidecar/; proxy_set_header Host ai-guard-sidecar.local.ping-devops.com:6500; }
    location = /token-workbench/ { add_header Set-Cookie "lab=token-workbench; Path=/; SameSite=Lax" always; set $up_token_workbench "token-workbench-token-workbench-1:5910"; proxy_pass http://$up_token_workbench/; proxy_set_header Host token-workbench.local.ping-devops.com:5910; }
    location = /hostile-mcp/ { add_header Set-Cookie "lab=hostile-mcp; Path=/; SameSite=Lax" always; set $up_hostile_mcp "hostile-mcp-hostile-mcp-1:4701"; proxy_pass http://$up_hostile_mcp/; proxy_set_header Host hostile-mcp.local.ping-devops.com:4701; }
    location = /agent-kill-switch/ { add_header Set-Cookie "lab=agent-kill-switch; Path=/; SameSite=Lax" always; set $up_agent_kill_switch "agent-kill-switch-agent-kill-switch-1:6550"; proxy_pass http://$up_agent_kill_switch/; proxy_set_header Host agent-kill-switch.local.ping-devops.com:6550; }
    location = /customer-agent/ { add_header Set-Cookie "lab=customer-agent; Path=/; SameSite=Lax" always; set $up_customer_agent "customer-agent-lab-customer-agent-lab-1:5601"; proxy_pass http://$up_customer_agent/; proxy_set_header Host customer-agent.local.ping-devops.com:5601; }
    location = /agent-registry-demo/ { add_header Set-Cookie "lab=agent-registry-demo; Path=/; SameSite=Lax" always; set $up_agent_registry_demo "agent-registry-demo-agent-registry-demo-1:5010"; proxy_pass http://$up_agent_registry_demo/; proxy_set_header Host agent-registry-demo.local.ping-devops.com:5010; }
    location = /ai-gateway-client/ { add_header Set-Cookie "lab=ai-gateway-client; Path=/; SameSite=Lax" always; set $up_ai_gateway_client "ai-gateway-client-lab-app-1:6880"; proxy_pass http://$up_ai_gateway_client/; proxy_set_header Host ai-gateway-client.local.ping-devops.com:6880; }
    location = /meridian-a2a-hop/ { add_header Set-Cookie "lab=meridian-a2a-hop; Path=/; SameSite=Lax" always; set $up_meridian_a2a_hop "meridian-a2a-hop-lab-meridian-a2a-hop-lab-1:6600"; proxy_pass http://$up_meridian_a2a_hop/; proxy_set_header Host meridian-a2a-hop.local.ping-devops.com:6600; }
    location = /learning-hub/ { add_header Set-Cookie "lab=learning-hub; Path=/; SameSite=Lax" always; set $up_learning_hub "learning-hub:4600"; proxy_pass http://$up_learning_hub/; proxy_set_header Host learning-hub.local.ping-devops.com:4600; }
    # Agent Connect: proxy directly (not via $lab_upstream) — the entry request has no lab cookie yet,
    # and the shelf refuses unknown paths (bad-host). muse-local must be running for this route.
    location = /agent-connect      { add_header Set-Cookie "lab=agent-connect; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:5100/; proxy_set_header Host local.ping-devops.com:5100; }
    location /agent-connect/      { add_header Set-Cookie "lab=agent-connect; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:5100/; proxy_set_header Host local.ping-devops.com:5100; }


    location = /mcp-discovery/ { add_header Set-Cookie "lab=mcp-discovery; Path=/; SameSite=Lax" always; set $up_mcp_discovery "mcp-discovery-mcp-discovery-1:5310"; proxy_pass http://$up_mcp_discovery/; proxy_set_header Host mcp-discovery.local.ping-devops.com:5310; }
    location = /mcp-scanner/ { add_header Set-Cookie "lab=mcp-scanner; Path=/; SameSite=Lax" always; set $up_mcp_scanner "mcp-scanner-lab-mcp-scanner-lab-1:7650"; proxy_pass http://$up_mcp_scanner/; proxy_set_header Host mcp-scanner.local.ping-devops.com:7650; }
    location = /p1az-inspector/ { add_header Set-Cookie "lab=p1az-inspector; Path=/; SameSite=Lax" always; set $up_p1az_inspector "p1az-inspector-lab-p1az-inspector-lab-1:4840"; proxy_pass http://$up_p1az_inspector/; proxy_set_header Host p1az-inspector.local.ping-devops.com:4840; }
    location = /jit-lab/ { add_header Set-Cookie "lab=jit-lab; Path=/; SameSite=Lax" always; set $up_jit_lab "jit-lab-jit-lab-1:7570"; proxy_pass http://$up_jit_lab/; proxy_set_header Host jit-lab.local.ping-devops.com:7570; }
    location = /obo-lab/ { add_header Set-Cookie "lab=obo-lab; Path=/; SameSite=Lax" always; set $up_obo_lab "obo-lab-obo-lab-1:7560"; proxy_pass http://$up_obo_lab/; proxy_set_header Host obo-lab.local.ping-devops.com:7560; }
    location = /jev-lab/ { add_header Set-Cookie "lab=jev-lab; Path=/; SameSite=Lax" always; set $up_jev_lab "jev-lab-jev-lab-1:7550"; proxy_pass http://$up_jev_lab/; proxy_set_header Host jev-lab.local.ping-devops.com:7550; }
    location = /deploy-test/ { add_header Set-Cookie "lab=deploy-test; Path=/; SameSite=Lax" always; set $up_deploy_test "deploy-test-lab-app-1:5590"; proxy_pass http://$up_deploy_test/; proxy_set_header Host deploy-test.local.ping-devops.com:5590; }
    location = /pingone-mcp-inspector/ { add_header Set-Cookie "lab=pingone-mcp-inspector; Path=/; SameSite=Lax" always; set $up_pingone_mcp_inspector "pingone-mcp-inspector-lab-pingone-mcp-inspector-lab-1:5201"; proxy_pass http://$up_pingone_mcp_inspector/; proxy_set_header Host pingone-mcp-inspector.local.ping-devops.com:5201; }
    location = /privilege-map/ { add_header Set-Cookie "lab=privilege-map; Path=/; SameSite=Lax" always; set $up_privilege_map "privilege-map-lab-privilege-map-1:5301"; proxy_pass http://$up_privilege_map/; proxy_set_header Host privilege-map.local.ping-devops.com:5301; }
    location = /privilege-a2a/ { add_header Set-Cookie "lab=privilege-a2a; Path=/; SameSite=Lax" always; set $up_privilege_a2a "privilege-a2a-anthropic-demo-lab-main-1:6881"; proxy_pass http://$up_privilege_a2a/; proxy_set_header Host privilege-a2a.local.ping-devops.com:6881; }
    location = /mcp-demo-client/ { add_header Set-Cookie "lab=mcp-demo-client; Path=/; SameSite=Lax" always; set $up_mcp_demo_client "mcp-demo-client-privilege-lab-app-1:6884"; proxy_pass http://$up_mcp_demo_client/; proxy_set_header Host mcp-demo-client.local.ping-devops.com:6884; }
    # entry: no lab cookie exists on a first visit, so proxy straight to the lab's container
    # (never via $lab_upstream, whose default is the shelf and which rejects a lab Host header).
    location = /coding-agents/      { add_header Set-Cookie "lab=coding-agents; Path=/; SameSite=Lax" always; set $ca_up coding-agents-lab-coding-agents-lab-1:7150; proxy_pass http://$ca_up/; proxy_set_header Host coding-agents-lab.local.ping-devops.com:7150; }
    location = /intent-purpose-behaviour/  { add_header Set-Cookie "lab=intent-purpose-behaviour; Path=/; SameSite=Lax" always; set $ipb_up intent-purpose-behaviour-lab-intent-purpose-behaviour-lab-1:7100; proxy_pass http://$ipb_up/; proxy_set_header Host intent-purpose-behaviour-lab.local.ping-devops.com:7100; }
    location = /saas-access/        { add_header Set-Cookie "lab=saas-access; Path=/; SameSite=Lax" always; set $saas_up saas-access-lab-saas-access-lab-1:7250; proxy_pass http://$saas_up/; proxy_set_header Host saas-access-lab.local.ping-devops.com:7250; }
    location = /data-protection/    { add_header Set-Cookie "lab=data-protection; Path=/; SameSite=Lax" always; set $dp_up data-protection-lab-data-protection-lab-1:7200; proxy_pass http://$dp_up/; proxy_set_header Host data-protection-lab.local.ping-devops.com:7200; }
    # id-jag kit: dev stack runs on the Mac (dev-live.sh), reached via host.docker.internal
    location = /id-jag-kit      { add_header Set-Cookie "lab=id-jag-kit; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:4720/; proxy_set_header Host id-jag-kit.local.ping-devops.com:4720; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto https; }
    location /id-jag-kit/       { add_header Set-Cookie "lab=id-jag-kit; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:4720/; proxy_set_header Host id-jag-kit.local.ping-devops.com:4720; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto https; }
    location = /idjag-runner      { add_header Set-Cookie "lab=idjag-runner; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:4780/; proxy_set_header Host idjag-runner.local.ping-devops.com:4780; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto https; }
    location /idjag-runner/       { add_header Set-Cookie "lab=idjag-runner; Path=/; SameSite=Lax" always; proxy_pass http://host.docker.internal:4780/; proxy_set_header Host idjag-runner.local.ping-devops.com:4780; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto https; }

    # intent encoder (Triton, KServe v2) for the Privilege console: a path on the one domain, no new /etc/hosts entry.
    # Console enters  local.ping-devops.com:8443  as the encoder endpoint (host:port form its validator wants).
    location /triton/       { proxy_pass http://host.docker.internal:8597/; proxy_set_header Host $http_host; }

    # everything else (SPA absolute /api, /assets) goes to the remembered lab
    location / {
        proxy_set_header Host $lab_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $lab_scheme://$lab_upstream;
        proxy_ssl_verify off;
    }
}
