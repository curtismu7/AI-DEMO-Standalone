# scheme per lab (pingone + pingfederate serve TLS inside)
map $cookie_lab $lab_scheme {
    default                 http;
}
# Cookies passed to the lab. A lab that by design accepts no credentials gets none: the launcher's own
# `lab` routing cookie rides on every request and would trip it. An empty value drops the header.
map $cookie_lab $lab_cookie {
    default                 $http_cookie;
    chatgpt-mcp-flow        "";
}


