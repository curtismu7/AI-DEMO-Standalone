name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Test
        run: node --test test/*.test.mjs scripts/*.test.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  gh-labs-drift:
    # Every *-LAB repo under the owner must be a submodule of the meta-repo.
    # Needs a token that can list the owner's repos; falls back to the
    # checkout's own token (fine for curtismu7, the repo owner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Install gh CLI
        run: (type -p gh || (sudo mkdir -p /etc/apt/keyrings && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install -y gh)) >/dev/null
      - name: Check lab repos are submodules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add url "https://x-access-token:${GH_TOKEN}@github.com/".insteadOf https://github.com/ 2>/dev/null || true
          bash scripts/check-gh-labs.sh --ci

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, the list is never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"
      - name: No AI attribution
        run: bash scripts/check-no-ai-attribution.sh

  lab-proxy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lab-proxy config guard
        run: shared/lab-proxy/check-config.sh

  ui-patterns:
    # Per-page UI pattern check. Fails only when an ENFORCED page (scripts/ui-pattern-converted.txt)
    # has a DRIFT finding, or the allowlist is stale. Every other page is advisory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Mutation tests (each rule catches what it claims)
        run: node --test test/ui-patterns.test.mjs test/ui-patterns-mutation.test.mjs
      - name: Enforced pages pass
        run: node scripts/check-ui-patterns.mjs --require-checkout
